name = "bewerbungsfoto-check"
main = "src/index.ts"
compatibility_date = "2026-11-03"
[dev]
port = 8787
ip = "127.0.0.1"
[vars]
# Prefer bounded pixel analysis. See docs/cpu-budget.md.
ANALYSIS_MODE = "auto"
